<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анкета — Nutritallinn</title>
  <meta name="description" content="Заполните анкету, и нутрициолог свяжется с вами в течение дня." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/form.css" />
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Нутрициолог</a>
  <a href="/" class="nav-back">← Назад</a>
</nav>

<main>
  <div class="form-card">
    <div id="errorMsg" class="cancelled-msg" style="display:none;">
      Не удалось отправить анкету. Проверьте поля и попробуйте ещё раз.
    </div>

    <div class="plan-badge">Анкета</div>
    <h1>Расскажите о себе</h1>
    <div class="divider"></div>

    <form id="surveyForm" method="POST" action="/api/survey">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" placeholder="Мария" required />
        </div>
        <div class="form-group">
          <label for="surname">Фамилия</label>
          <input type="text" id="surname" name="surname" placeholder="Иванова" required />
        </div>
      </div>

      <div class="form-group">
        <label for="age">Возраст</label>
        <input type="number" id="age" name="age" placeholder="30" min="16" max="99" required />
      </div>

      <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" placeholder="+372 55 43 213" required />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="maria@gmail.com" required />
      </div>

      <div class="form-group">
        <label for="goal">Ожидаемый результат</label>
        <textarea id="goal" name="goal" maxlength="1000"
                  placeholder="Чего вы хотите достичь? Например: снизить вес, наладить питание, разобраться с нехваткой энергии."></textarea>
      </div>

      <div class="form-group">
        <label for="expectations">Ожидания от работы со мной</label>
        <textarea id="expectations" name="expectations" maxlength="1000"
                  placeholder="Что для вас важно в совместной работе? Например: поддержка и обратная связь, чёткий план, объяснения без давления."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Послать
      </button>
    </form>

    <p class="notice">
      Анкета ни к чему не обязывает. Специалист свяжется с вами по телефону или e-mail в течение дня.
    </p>
  </div>
</main>

<script>
  if (new URLSearchParams(window.location.search).get('error') === '1') {
    document.getElementById('errorMsg').style.display = 'block';
  }

  document.getElementById('surveyForm').addEventListener('submit', function () {
    if (!this.checkValidity()) return;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Отправляем...';
  });
</script>

</body>
</html>
